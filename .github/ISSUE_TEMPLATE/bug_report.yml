name: Bug report
description: Report a reproducible problem in Envoi.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please remove sensitive data from logs and screenshots before submitting.

  - type: input
    id: version
    attributes:
      label: Envoi version
      description: Provide the release tag, commit, or development revision you are using.
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the operating system and architecture.
      placeholder: Windows 11 x64, macOS 15 arm64, etc.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
      placeholder: Tell us what you observed and what should have happened.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence of steps.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Paste relevant logs in a code block and attach screenshots when useful. Remove secrets and private paths.
      render: text

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other information that may help investigate the issue.
