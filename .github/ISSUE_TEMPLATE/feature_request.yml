name: Feature request
description: Suggest an improvement or new capability for Envoi.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user problem or workflow limitation should this address?
      placeholder: I need to ... because ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or experience you would like.
      placeholder: It would help if Envoi ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workaround or alternative approach you have tried.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add mockups, examples, references, or other useful context.
