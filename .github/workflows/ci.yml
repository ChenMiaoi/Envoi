name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm run setup
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:ai
      - run: npm run test:local
      - run: npm run test:desktop
        if: runner.os == 'Windows'
# The runner has no TeX toolchain installed, so TeX-dependent local tests
# self-skip rather than fail. test:demo (needs a compiled example PDF from
# demo:build) stays a manual per-machine step; see CONTRIBUTING.md.
