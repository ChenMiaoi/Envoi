name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # macOS: local compilation targets macOS (TeX toolchain + sandbox-exec).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm run setup
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:ai
      - run: npm run test:local
# The runner has no TeX toolchain installed, so TeX-dependent local tests
# self-skip rather than fail. test:demo (needs a compiled example PDF from
# demo:build) stays a manual per-machine step; see CONTRIBUTING.md.
