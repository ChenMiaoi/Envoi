name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm run ci:check
        env:
          ENVOI_DESKTOP_TEST_FULL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
# The runner has no TeX toolchain installed, so TeX-dependent local tests
# self-skip rather than fail. test:demo (needs a compiled example PDF from
# demo:build) stays a manual per-machine step; see CONTRIBUTING.md.
