name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Quick and full runs must not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            shard: 1/2
          - os: macos-latest
            shard: 2/2
          - os: windows-latest
            shard: 1/2
          - os: windows-latest
            shard: 2/2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Prepare LLVM with RISC-V support
        if: runner.os == 'macOS'
        run: |
          brew list llvm >/dev/null 2>&1 || brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - run: npm run ci:check
        env:
          ENVOI_DESKTOP_TEST_SHARD: ${{ matrix.shard }}
          ENVOI_DESKTOP_TEST_FULL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
  # Preserve the existing required-check names. Any failed or cancelled shard
  # keeps both gates red; a partial desktop run cannot satisfy branch protection.
  check:
    if: ${{ always() }}
    needs: validate
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all validation jobs
        env:
          RESULT: ${{ needs.validate.result }}
        run: test "$RESULT" = success

# The runner has no TeX toolchain installed, so TeX-dependent local tests
# self-skip rather than fail. test:demo (needs a compiled example PDF from
# demo:build) stays a manual per-machine step; see CONTRIBUTING.md.
