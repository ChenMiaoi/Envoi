appId: com.envoi.app
productName: Envoi
publish:
  provider: github
  owner: ChenMiaoi
  repo: Envoi
asar: true
directories:
  output: release
files:
  - dist/**
  - package.json
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  identity: null
dmg:
  title: Envoi

extraResources:
  - from: ../examples/demo
    to: demo
    filter:
      - "**/*"
      - "!**/.git{,/**}"
      - "!**/.envoi{,/**}"
      - "!**/.paperdesk{,/**}"

win:
  artifactName: Envoi.Setup.${version}.${ext}
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
